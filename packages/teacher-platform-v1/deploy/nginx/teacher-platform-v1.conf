    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
}

location = /zugang/work.php {
    client_max_body_size 8m;
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
}

location = /zugang/arbeiten/index.php {
    client_max_body_size 8m;
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
}

location ~ ^/zugang/.*\.(?:php|sqlite|db|json|log|key|env)$ { return 404; }

location = /lehrer {
    return 308 /lehrer/;
}

location = /lehrer/ {
    index index.php;
}

location = /lehrer/index.php {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
}

location = /zugriff-anfragen {
    return 308 /zugriff-anfragen/;
}

location = /zugriff-anfragen/ {
    index index.php;
}

location = /zugriff-anfragen/index.php {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
}

location = /support-anfragen {
    return 308 /support-anfragen/;
}

location = /support-anfragen/ {
    index index.php;
}

location = /support-anfragen/index.php {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
}

location = /api/teacher-platform/feedback.php {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_read_timeout 55s;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
}

# Keine weiteren Skripte oder Datendateien unter den Plattformpfaden ausliefern.
location ~ ^/(?:lehrer|zugriff-anfragen|support-anfragen|api/teacher-platform)/.*\.php$ {
    return 404;
}

location ~ ^/(?:lehrer|zugriff-anfragen|support-anfragen|api/teacher-platform)/.*\.(?:sqlite|db|json|log|key|env)$ {
    deny all;
}
