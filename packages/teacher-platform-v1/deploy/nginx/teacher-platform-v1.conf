# Beispiel: document_root und PHP-FPM-Socket an die Installation anpassen.
location = /lehrer { return 308 /lehrer/; }
location = /lehrer/ { index index.php; }
location = /lehrer/index.php {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param TEACHER_PLATFORM_BOOTSTRAP /srv/teacher-platform-v1/app/bootstrap.php;
    fastcgi_pass unix:/run/php/php-fpm.sock;
}
location = /zugriff-anfragen { return 308 /zugriff-anfragen/; }
location = /zugriff-anfragen/ { index index.php; }
location = /zugriff-anfragen/index.php {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param TEACHER_PLATFORM_BOOTSTRAP /srv/teacher-platform-v1/app/bootstrap.php;
    fastcgi_pass unix:/run/php/php-fpm.sock;
}
location = /api/teacher-platform/feedback.php {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param TEACHER_PLATFORM_BOOTSTRAP /srv/teacher-platform-v1/app/bootstrap.php;
    fastcgi_read_timeout 55s;
    fastcgi_pass unix:/run/php/php-fpm.sock;
}
location ~ ^/(?:lehrer|zugriff-anfragen|api/teacher-platform)/.*\.php$ { return 404; }
location ~ ^/(?:lehrer|zugriff-anfragen|api/teacher-platform)/.*\.(?:sqlite|db|json|log|key|env)$ { deny all; }
