# Zentrale Lehrerplattform v1 – nur exakt benannte PHP-Endpunkte ausführen.

# Gemeinsamer Zugang: nur diese Handler ausführen.
location = /zugang { return 308 /zugang/; }
location = /zugang/ { index index.php; }
location = /zugang/arbeiten { return 308 /zugang/arbeiten/; }
location = /zugang/arbeiten/ { index index.php; }

location = /zugang/index.php {
    client_max_body_size 8m;
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
}

location = /zugang/oidc.php {
    client_max_body_size 8m;
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
}

location = /zugang/directory.php {
    client_max_body_size 8m;
    try_files $uri =404;
